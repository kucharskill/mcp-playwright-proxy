name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - name: Packed package smoke
        shell: bash
        env:
          PW_SMOKE_BROWSER: chrome
        run: |
          mkdir -p .tmp/installed
          npm install --prefix .tmp/installed --ignore-scripts "./.tmp/releases/$(node -p 'require("./.tmp/releases/archive.json").filename')"
          node scripts/smoke.mjs .tmp/installed/node_modules/mcp-playwright-proxy/src/cli.js
          node scripts/lifecycle-smoke.mjs .tmp/installed/node_modules/mcp-playwright-proxy/src/cli.js
